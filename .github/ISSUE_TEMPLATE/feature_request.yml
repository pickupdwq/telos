name: Feature request / 功能建议
description: Describe a use case and the behavior you need.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and alternatives / 约束与替代方案
